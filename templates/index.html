<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Tutor — Python Functions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">rebuild/classroom::adaptive-tutor</div>
            <div class="subtitle">teaching one subject, deeply: <strong>Python functions</strong></div>
        </header>

        <main class="content-grid">
            <section class="tutor-panel">
                <div id="tutor-content">
                    <div class="move-badge slow_down">Booting the tutor</div>
                    <div class="explanation-text">Loading initial assessment...</div>
                </div>
                <form id="answer-form">
                    <textarea id="user-answer" placeholder="Type your answer..." required></textarea>
                    <button type="submit" id="submit-btn">Answer</button>
                </form>
            </section>

            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>learning path</h3>
                    <div id="learning-path">
                        <div class="commit-node slow_down">
                            <span class="node-dot"></span>
                            <div class="node-info">
                                <strong>definition</strong>
                                <span class="node-move">slow down</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>mastery estimate</h3>
                    <div class="mastery-list">
                        <div class="mastery-item">
                            <span>definition</span>
                            <div class="progress-bar"><div class="fill" id="mastery-definition" style="width: 10%;"></div></div>
                        </div>
                        <div class="mastery-item">
                            <span>parameters</span>
                            <div class="progress-bar"><div class="fill" id="mastery-parameters" style="width: 0%;"></div></div>
                        </div>
                        <div class="mastery-item">
                            <span>return values</span>
                            <div class="progress-bar"><div class="fill" id="mastery-return-values" style="width: 0%;"></div></div>
                        </div>
                        <div class="mastery-item">
                            <span>scope</span>
                            <div class="progress-bar"><div class="fill" id="mastery-scope" style="width: 0%;"></div></div>
                        </div>
                        <div class="mastery-item">
                            <span>default args</span>
                            <div class="progress-bar"><div class="fill" id="mastery-default-args" style="width: 0%;"></div></div>
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
